name: CI

# Repo PUBLIC => minutes CI ILLIMITEES (macOS inclus, pas de multiplicateur x10). Suite LEGERE.
# paths STRICTS (seulement le code/tests) + cancel-in-progress + cache npm => cout par push minimal.
# La matrice OS est ICI le POINT : elle exerce les branches POSIX (ps, kill -pid, spawn detached)
# que la machine Windows de dev ne peut pas prouver. Linux + macOS (BSD) + Windows = vraie preuve
# cross-OS sur les 3 familles que l'equipe utilise. NE PAS retirer macOS (ps BSD != ps GNU).
on:
  push:
    branches: [master]
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', 'stryker.conf.json', 'ARBORESCENCE.md', '.gitattributes', '.github/workflows/ci.yml']
  pull_request:
    branches: [master]
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', 'stryker.conf.json', 'ARBORESCENCE.md', '.gitattributes', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Suite complete sur les DEUX OS => exerce treeKill/listProcesses/detached cote POSIX ET Windows.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Gate mutation sur les fonctions PURES uniquement (OS-agnostiques) => ubuntu seul suffit.
  # Parallele au job test (aucun `needs:` : le wall = le job le plus long, pas la somme).
  mutation:
    name: Gate mutation (Stryker, break=94)
    runs-on: ubuntu-latest
    # 🛑 BORNE OBLIGATOIRE — UN GATE QUI NE REND PAS DE VERDICT NE PROTEGE RIEN.
    # MESURE 20/08/2026 : TOUS les runs du 03/08 au 20/08 ont dure 46 a 51 min et se sont termines
    # par « The hosted runner lost communication with the server ». Signature relevee sur le job
    # 96373135403 : `npm run test:mut` demarre a 09:05:11 et reste `in_progress` / `conclusion:null`
    # jusqu'a la mort du runner a 09:51 — AUCUN step en echec, et surtout AUCUN LOG UPLOADE (un
    # runner qui perd la communication n'envoie rien). Le gate etait donc rouge en permanence ET
    # MUET : impossible de savoir pourquoi, donc destine a etre ignore puis contourne.
    # ⚠️ SANS CETTE LIGNE, LE DEFAUT EST `timeout-minutes: 360` (doc GitHub Actions) = 6 h de silence.
    # ⚠️ CE N'EST PAS UN ASSOUPLISSEMENT — c'est l'inverse : un depassement de `timeout-minutes` est
    # annule PAR GITHUB (pas par le runner), donc le job est marque ECHEC **et ses logs SONT
    # uploades**. La borne transforme une panne muette en verdict lisible. NE JAMAIS la remplacer
    # par `continue-on-error` : ce serait rendre le job vert en le neutralisant.
    # ⚠️ VALEUR ANCREE SUR UNE MESURE, jamais un chiffre rond de confort : run SAIN = **2 min 01 s**
    # (run 30772241326, 02/08/2026, meme workflow, meme absence de cache, 715 mutants). 10 min = 5x
    # cette reference. Au-dela, ce n'est plus de la lenteur : c'est une panne, et elle doit le DIRE.
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ⚠️ CACHE INCREMENTAL STRYKER — `restore` ET `save` SEPARES, et `save` en `if: always()`.
      # 🛑 LA FORME COMBINEE `actions/cache@v4` NE SAUVE QU'EN CAS DE SUCCES DU JOB (son post-step
      # est saute quand le job echoue). Or CE job echoue par construction des que le score passe
      # sous le plancher : avec la forme combinee, le cache ne serait JAMAIS peuple, et chaque run
      # re-muterait les 715 mutants a partir de zero. Le couple restore/save est la SEULE forme qui
      # peuple le cache d'un job qui a le droit de rougir. NE PAS « simplifier » en cache@v4.
      # ⚠️ Un fichier incremental issu d'un run ROUGE reste VALIDE : il indexe les resultats par HASH
      # de fichier, jamais par verdict. Stryker reinvalide seul ce que le contenu a change => un vert
      # incremental n'est jamais un vert perime, et un rouge cache ne se propage pas.
      # 🛑 NE JAMAIS `rm` ce fichier pour forcer un run complet : `stryker run --force` le RECONSTRUIT,
      # `rm` le DETRUIT (et coute a tous les runs suivants).
      # ⚠️ Cle par SHA + `restore-keys` par prefixe : chaque run repart du dernier etat connu et en
      # depose un nouveau (une cle deja ecrite est immuable chez GitHub). L'EVICTION est celle du
      # store GitHub (7 jours d'inactivite / 10 Go par depot), jamais un nettoyage maison.
      - name: Restaurer le fichier incremental Stryker
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-
      # 🛑 LA BORNE DOIT VIVRE **DANS** LE RUNNER, PAS SEULEMENT AU-DESSUS DE LUI.
      # MESURE 20/08/2026 (run 32357523205, job 96389817850) : `timeout-minutes: 10` a bien coupe le
      # job — annule a 10:24:26 au lieu des 46 min de mort silencieuse — MAIS **AUCUN LOG N'A ETE
      # TELEVERSE** : `/actions/jobs/96389817850/logs` rend `BlobNotFound`, et le zip du run ne
      # contient que les AUTRES jobs. C'est LE RUNNER qui televerse ses logs : quand il ne repond
      # plus, GitHub peut le FAUCHER, pas le faire PARLER. Une borne EXTERNE rend donc un verdict
      # SANS diagnostic — mieux que rien, insuffisant pour reparer.
      # ⇒ `timeout` (coreutils, present sur ubuntu-latest) tue le PROCESSUS depuis l'interieur,
      # pendant que le runner est ENCORE VIVANT : le step sort en 124, le job est ROUGE, et la
      # sortie de Stryker (reporter `progress-append-only` en CI) est televersee normalement — on
      # voit donc a QUEL mutant ca se fige. 🛑 BORNE INTERNE TOUJOURS PLUS COURTE QUE LA BORNE
      # EXTERNE (6 min < 9 min) : sinon GitHub fauche le runner en premier et on reperd les logs.
      # ⚠️ `--kill-after` est OBLIGATOIRE : `npm` relaie SIGTERM, mais un process fige peut l'ignorer.
      # Sans le SIGKILL de secours, la borne elle-meme pourrait pendre.
      # ⚠️ Les sondes encadrantes testent l'hypothese OOM (seule explication connue d'un runner qui
      # perd la communication sans qu'aucun step n'echoue). `dmesg` est l'autorite qui SAIT : le
      # tueur OOM du noyau y laisse une trace nominative. On MESURE, on ne suppose pas.
      - name: Sonde ressources (avant)
        run: nproc && free -m && df -h /
      # 🛑 LA SORTIE VA DANS UN FICHIER, JAMAIS DIRECTEMENT DANS LE TUYAU DU STEP.
      # MESURE 20/08/2026 (run 32358951280) : `timeout ... 8m npm run test:mut` ecrivant dans le
      # tuyau du step N'A PAS termine le step — il etait encore `in_progress` 10 min apres. Cause :
      # `timeout` tue son enfant DIRECT (npm), pas le groupe ; les petits-enfants Stryker orphelins
      # gardent le tuyau de sortie OUVERT, et le runner attend l'EOF qui ne vient jamais. La borne
      # existait donc sans borner quoi que ce soit.
      # ⚠️ En redirigeant vers un FICHIER, les orphelins retiennent le FICHIER, pas le tuyau : le
      # step se termine TOUJOURS, donc le job se termine, donc **les logs sont televerses** (ils ne
      # le sont qu'a la fin du JOB — verifie : le zip du run 32358951280 ne contenait AUCUN octet
      # pour ce job, pas meme pour les steps termines dans les 20 premieres secondes).
      # ⚠️ `exit $code` PRESERVE LE VERDICT : un depassement sort en 124, un score sous le plancher
      # garde le code de Stryker. On ne troque JAMAIS le rouge contre du confort de diagnostic.
      # 🔬 MESURE EN COURS — `--concurrency 1` (20/08/2026). Trois runs bornes (32357523205,
      # 32358951280, 32360362878) ont montre que le runner cesse de repondre AVANT meme que la
      # borne interne `timeout` ne se declenche : ni le `timeout`, ni la redirection vers fichier
      # n'ont termine le step, et le zip du run ne contient ZERO octet pour ce job — pas meme les
      # steps deja termines en succes. Le gel est donc au niveau du RUNNER, pas du shell.
      # ⇒ Hypothese testee ici, et c'est la premiere prescrite par la doctrine du parc pour cette
      # signature (`ETIMEDOUT` child-process-proxy = RAM insuffisante) : epuisement de ressources a
      # `concurrency: 3` sur un runner 4 vCPU. On descend a 1 pour SAVOIR, pas pour aller plus vite.
      # ⚠️ `stryker.conf.json` reste a 3 (poste de dev) : seule la CI est surchargee, et le drapeau
      # est DECLARE ici plutot que dilue dans la config partagee.
      - name: Gate mutation (borne DANS le runner, sortie vers FICHIER)
        run: |
          set +e
          timeout --verbose --signal=TERM --kill-after=30s 6m npm run test:mut -- --concurrency 1 > mutation.log 2>&1
          code=$?
          set -e
          echo "::group::sortie Stryker (code de sortie: $code ; 124 = borne atteinte)"
          tail -c 400000 mutation.log
          echo "::endgroup::"
          exit $code
      - name: Sonde ressources + tueur OOM (meme si rouge)
        if: always()
        run: |
          free -m
          sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || echo "aucune trace du tueur OOM"
      - name: Sauvegarder le fichier incremental Stryker
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ runner.os }}-${{ github.sha }}

  # 🛑 GATE TLA+/TLC SUPPRIME le 03/08/2026 — AVEC le verrou fichier qu'il prouvait.
  # Il appelait `npm run test:spec` sur `spec/SupervisorLock.tla`, disparus a l'amputation du
  # superviseur : le job echouait donc a CHAQUE push, en pur bruit rouge.
  # ⚠️ LECON A NE PAS PERDRE : ce verrou etait FORMELLEMENT PROUVE **et n'aurait pas du exister**.
  # Une preuve formelle valide le COMPORTEMENT d'un composant, jamais son DROIT D'EXISTER — et la
  # rigueur qu'on y met le rend paradoxalement exempt de la question. Reposer `/stack-audit`.
  # ⚠️ TLA+ redevient OBLIGATOIRE si une concurrence NON SERIALISEE reapparait. Ce n'est pas le cas
  # aujourd'hui : le daemon est un point de serialisation unique (un process, un thread, une Map),
  # donc il n'y a aucune race a prouver.

  # Gates couplage (jscpd cliquet + dependency-cruiser no-circular) — ~30s, par-push OK.
  coupling:
    name: Gates couplage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coupling
